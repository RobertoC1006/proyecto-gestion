map $http_host $loopback_host {
    default "";
    ~^127\.0\.0\.1(?<loopback_port>:\d+)?$ localhost$loopback_port;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=10s;
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"campusitsm-web"}';
    }
    location /api/ {
        access_log off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Las respuestas autenticadas y los errores tampoco deben almacenarse.
        add_header Cache-Control "no-store" always;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
    location / {
        # El formulario y los enlaces Auth deben usar el origen local acordado.
        if ($loopback_host != "") {
            return 308 $scheme://$loopback_host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
