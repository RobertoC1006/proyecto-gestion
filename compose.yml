name: campusitsm

x-api: &api
  image: campusitsm-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-campusitsm}:${POSTGRES_PASSWORD:-campusitsm_local_only}@db:5432/${POSTGRES_DB:-campusitsm}?schema=public&connect_timeout=5&socket_timeout=5
    PREDICTIONS_URL: http://predictions:8000
    FILES_DIR: /data/files
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    SUPABASE_URL: ${SUPABASE_URL:-}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
    AUTH_INSTITUTION_CODE: ${AUTH_INSTITUTION_CODE:-UPT-DEMO}
    TZ: UTC
  networks: [internal]

services:
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusitsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusitsm_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-campusitsm}
      TZ: UTC
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    command: [npm, run, db:deploy]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  seed:
    <<: *api
    profiles: [tools]
    command: [npm, run, db:seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  predictions:
    image: campusitsm-predictions:local
    build:
      context: .
      dockerfile: services/predictions/Dockerfile
    volumes: [models_data:/models]
    networks: [internal]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *api
    # Solo la API necesita salida a Internet para Supabase; PostgreSQL/Python siguen internos.
    networks: [internal, auth_egress]
    volumes: [files_data:/data/files]
    depends_on:
      migrate: {condition: service_completed_successfully}
      predictions: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

  bootstrap-admin:
    <<: *api
    profiles: [tools]
    command: [node, prisma/bootstrap-admin.cjs]
    environment:
      <<: *api-env
      BOOTSTRAP_USER_ID: ${BOOTSTRAP_USER_ID:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  web:
    image: campusitsm-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    networks: [internal, entry]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  internal:
    internal: true
  entry:
  auth_egress:

volumes:
  postgres_data:
  files_data:
  models_data:
